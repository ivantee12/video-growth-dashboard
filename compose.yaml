services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: video_growth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - video_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video_growth"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  video_pgdata:
